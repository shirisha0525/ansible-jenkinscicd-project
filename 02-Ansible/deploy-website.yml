
---
- name: Deploy custom website
  hosts: webservers
  become: true

  tasks:
    - name: Copy website page to Nginx
      ansible.builtin.copy:
        src: ../files/index.html
        dest: /var/www/html/index.html
        owner: www-data
        group: www-data
        mode: '0644'

    - name: Ensure Nginx is running
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

